<style>
  /* Impede UserWay de interferir dentro do FAQ */
  #faqArea.uw-ignore *,
  #faqArea *,
  .uw-ignore * {
    pointer-events: auto !important;
  }

  /* O menu próprio controla o VLibras; esconde o botão flutuante do widget. */
  html body #vlibras-access-wrapper {
    display: none !important;
  }

  /* Esconde o botão padrão do UserWay ← adiciona isso */
  #userwayAccessibilityIcon,
  [id^="userway"],
  [class^="userway"],
  .__userway_button {
    display: none !important;
  }
</style>

    <div id="root"></div>
    <!-- O VLibras cria o widget automaticamente; o atalho próprio fica no menu de acessibilidade. -->
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>
    <script type="module" src="/src/main.jsx"></script>
